[package]
name = "envoy-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Name-addressed local store for published envoy bundles: atomic fills, in-use leases, and retention."

[lib]
name = "envoy_store"

[dependencies]
fs4 = { version = "1", features = ["sync"] }
json_comments = "0.2"
rayon = "1"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing = "0.1"

# Reads the Windows setting that lets a path pass 260 characters.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
