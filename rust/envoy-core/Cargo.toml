[package]
name = "envoy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Environment orchestration core logic for envoy (bundle discovery, environment operators, command registry, process execution)."

[lib]
name = "envoy_core"

[dependencies]
age = "0.10"
base64 = "0.22"
ctrlc = "3"
envoy-store = { path = "../envoy-store" }
fs4 = { version = "1", features = ["sync"] }
hex = "0.4"
json_comments = "0.2"
opentelemetry = "0.32"
opentelemetry-otlp = { version = "0.32", features = ["http-proto", "reqwest-blocking-client"] }
opentelemetry_sdk = "0.32"
rayon = "1"
regex = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2 = "0.10"
thiserror.workspace = true
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
