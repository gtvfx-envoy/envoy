[package]
name = "envoy-shim"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A light launcher: reads the redirect file, caches the pinned envoy version locally, and runs it."
build = "build.rs"

[lib]
name = "envoy_shim"

# Packaged as `envoy` (and `en`). The cargo name differs so that it does not
# collide with envoy-cli's `envoy` binary in a shared target directory.
[[bin]]
name = "envoy-shim"
path = "src/main.rs"

[dependencies]
envoy-config = { path = "../envoy-config" }
envoy-store = { path = "../envoy-store" }

# Windows cannot replace a process, so the shim waits for envoy and ignores
# Ctrl+C itself; on Unix it simply becomes envoy.
[target.'cfg(not(unix))'.dependencies]
ctrlc = "3"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[dev-dependencies]
tempfile = "3"
