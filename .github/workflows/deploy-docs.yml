name: Deploy Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build ProperDocs site
    runs-on: ["self-hosted", "Linux", "X64", "debian-13", "ci"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'

      - name: Install stable Rust toolchain
        # Needed because `pip install .` below compiles the maturin-backed
        # envoy-py (PyO3) extension via cargo.
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install envoy (with docs extras)
        # Installing envoy itself lets mkdocstrings introspect its
        # docstrings; the [docs] extra brings properdocs, mkdocstrings, and
        # the gen-files/literate-nav plugins used for auto-generated API
        # reference pages under docs/reference/ (see docs/gen_ref_pages.py).
        #
        # This builds+installs the maturin-backed envoy-py (PyO3) wheel --
        # the distributed `envoy` package -- compiling the Rust extension
        # via cargo. The Rust crate docs are built separately below as an
        # internal-only artifact, not published to this site.
        run: pip install .[docs]

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build site
        run: python -m properdocs build --clean

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ["self-hosted", "Linux", "X64", "debian-13", "ci"]
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  rust-docs:
    # Internal-only rustdoc build for the Rust workspace, for maintainers
    # working on the rust/ migration. NOT published to GitHub Pages (the
    # public docs site above documents the Python API surface, which is
    # what consumers actually use) -- uploaded as a plain workflow artifact
    # instead, downloadable from the Actions run summary.
    name: Build internal rustdoc (not published)
    runs-on: ["self-hosted", "Linux", "X64", "debian-13", "ci"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build rustdoc
        working-directory: rust
        run: cargo doc --workspace --exclude envoy-py --no-deps

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'

      - name: Build rustdoc for envoy-py
        # Separate step: envoy-py links against a Python interpreter (pyo3),
        # so it needs the Python toolchain set up first (unlike the other
        # crates above).
        working-directory: rust
        run: cargo doc -p envoy-py --no-deps

      - name: Upload rustdoc artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustdoc
          path: rust/target/doc/
          retention-days: 14

