name: Lint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  ruff:
    name: Ruff (lint + format check)
    runs-on: ["self-hosted", "Linux", "X64"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'

      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install ruff

      - name: Run ruff check
        run: ruff check scripts rust/envoy-py/python rust/envoy-py/tests

      # Independent of `ruff check` above: without the guard a lint failure
      # short-circuits the job and hides any formatting drift, so a single
      # push can only ever surface one of the two.
      - name: Run ruff format --check
        if: ${{ !cancelled() }}
        run: ruff format --check scripts rust/envoy-py/python rust/envoy-py/tests

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ["self-hosted", "Linux", "X64"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # fmt / clippy / tests are three *independent* checks. Without the
      # `!cancelled()` guards below, a step's default condition is "all
      # previous steps succeeded", so a trivial formatting failure
      # short-circuits the job before Clippy and the tests ever run --
      # hiding real compile errors and test failures until someone happens
      # to run them locally. `!cancelled()` (rather than `always()`) still
      # lets an explicit workflow cancellation stop the job promptly.
      - name: Run cargo fmt --check
        working-directory: rust
        run: cargo fmt --check

      - name: Run cargo clippy
        # envoy-py requires linking against a Python interpreter (pyo3) and
        # is built/tested separately via maturin (see build-release.yml),
        # not as part of this plain cargo workspace check.
        if: ${{ !cancelled() }}
        working-directory: rust
        run: cargo clippy --workspace --exclude envoy-py --all-targets -- -D warnings

      - name: Run cargo test
        if: ${{ !cancelled() }}
        working-directory: rust
        run: cargo test --workspace --exclude envoy-py

  rust-envoy-py:
    name: Rust envoy-py (fmt + clippy + test, PyO3)
    runs-on: ["self-hosted", "Linux", "X64"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.11.9'

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry/build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # As in the `rust` job above: fmt / clippy / test are independent, so
      # guard each against an earlier one short-circuiting the job. The
      # wheel chain below is different -- those steps genuinely depend on
      # each other, so they're gated on the preceding step's own outcome
      # rather than run unconditionally.
      - name: Run cargo fmt --check
        working-directory: rust
        run: cargo fmt --check -p envoy-py

      - name: Run cargo clippy
        if: ${{ !cancelled() }}
        working-directory: rust
        run: cargo clippy -p envoy-py --all-targets -- -D warnings

      - name: Run cargo test
        # cc (the linker driver) needs an extra -L search path for
        # libpythonX.Y.so: this self-hosted runner's actions/setup-python
        # unpacks Python under its own tool-cache directory (exported as
        # $pythonLocation by the "Set up Python" step above), but the
        # Python build's own sysconfig LIBDIR is frozen at
        # /opt/hostedtoolcache/... (the path used on GitHub-hosted
        # runners), which doesn't exist here -- so pyo3-build-config's
        # -L flag points nowhere and linking envoy-py's test binary
        # against libpython fails. LIBRARY_PATH is read directly by cc/ld
        # as an additional search directory, independent of that guess.
        if: ${{ !cancelled() }}
        working-directory: rust
        run: LIBRARY_PATH="$pythonLocation/lib" cargo test -p envoy-py --lib

      - name: Build wheel with maturin
        id: build-wheel
        if: ${{ !cancelled() }}
        run: |
          pip install maturin
          python -m maturin build --release --manifest-path rust/envoy-py/Cargo.toml

      - name: Install built wheel + pytest
        id: install-wheel
        if: ${{ !cancelled() && steps.build-wheel.outcome == 'success' }}
        run: |
          pip install pytest
          pip install --force-reinstall --no-index --find-links rust/target/wheels envoy

      - name: Run Python contract + consumer smoke tests against the wheel
        # These prove envoy-py's Python-facing behavior (not just that the
        # crate compiles/its own Rust unit tests pass) -- see
        # rust/envoy-py/tests/python_contract/README.md and
        # rust/envoy-py/tests/consumer_smoke/README.md for scope/rationale.
        if: ${{ !cancelled() && steps.install-wheel.outcome == 'success' }}
        run: python -m pytest rust/envoy-py/tests -v

  windows:
    name: Windows x64 tests
    runs-on: ["self-hosted", "Windows", "X64"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Ensure Git Bash is on PATH
        shell: pwsh
        run: |
          $git_bash_directory = 'C:\Program Files\Git\bin'
          $git_bash_path = Join-Path $git_bash_directory 'bash.exe'
          if (-not (Test-Path -LiteralPath $git_bash_path)) {
              throw 'Git Bash is required by the Rust toolchain action.'
          }
          # Append rather than prepend: $GITHUB_PATH always *prepends* for
          # subsequent steps, which would put Git's own tools (e.g. its
          # coreutils link.exe) ahead of the MSVC linker cargo/rustc need to
          # link this target. Setting PATH explicitly via $GITHUB_ENV instead
          # keeps Git Bash discoverable without letting it shadow MSVC.
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "PATH=$env:PATH;$git_bash_directory"

      # This job never ran vcvarsall.bat, so cl.exe/link.exe were never
      # guaranteed to be on PATH at all: rustc has to fall back to its own
      # MSVC auto-detection (registry/vswhere-based) to find the linker,
      # which is not reliable on every self-hosted runner. Setting up the
      # Developer Command Prompt environment explicitly makes the MSVC
      # tools directory (with the real link.exe) authoritative on PATH for
      # every later step, regardless of what else is already on PATH.
      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc

      - name: Verify MSVC toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command cl.exe -ErrorAction SilentlyContinue)) {
            throw "Microsoft Visual C++ compiler (cl.exe) not found. Ensure Visual Studio Build Tools are installed."
          }
          # cl.exe resolving is not sufficient: Git for Windows ships its own
          # coreutils link.exe (for hardlinks), which is a different program
          # entirely. If it precedes the MSVC linker on PATH, cargo/rustc
          # invoke it instead and fail with a confusing "link: extra operand"
          # error. Fail fast here with a clear message instead.
          $link = Get-Command link.exe -ErrorAction SilentlyContinue
          if (-not $link) {
            throw "link.exe not found. Ensure Visual Studio Build Tools are installed."
          }
          if ($link.Source -notmatch 'Microsoft Visual Studio|VC\\Tools\\MSVC') {
            throw "link.exe resolved to '$($link.Source)', which is not the MSVC linker (likely Git's coreutils link.exe shadowing it on PATH). Fix PATH ordering so the MSVC tools directory precedes Git's."
          }
          Write-Host "MSVC toolchain verified (cl.exe and link.exe both resolve to MSVC)"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # The two `cargo test` invocations are independent of each other, so
      # a native-workspace failure shouldn't hide a PyO3 binding failure.
      # The wheel steps below genuinely depend on the preceding step, so
      # they're gated on its outcome rather than run unconditionally.
      - name: Test native workspace
        working-directory: rust
        run: cargo test --workspace --exclude envoy-py

      - name: Test Rust Python bindings
        if: ${{ !cancelled() }}
        working-directory: rust
        run: cargo test -p envoy-py --lib

      - name: Build wheel
        id: build-wheel
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python -m pip install maturin pytest
          python -m maturin build --release --manifest-path rust/envoy-py/Cargo.toml

      - name: Test installed wheel
        if: ${{ !cancelled() && steps.build-wheel.outcome == 'success' }}
        shell: pwsh
        run: |
          python -m pip install --force-reinstall --no-index --find-links rust/target/wheels envoy
          python -m pytest rust/envoy-py/tests -v

  envoy-utils-compatibility:
    name: Envoy Utils compatibility (${{ matrix.os_name }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os_name: Linux
          - runner: windows-2025
            os_name: Windows
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout Envoy
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Classify Envoy Core impact
        id: impact
        shell: bash
        run: >-
          python scripts/release_automation.py impact
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
          --output impact.json
          --github-output "$GITHUB_OUTPUT"

      - name: Checkout Envoy Utils
        if: steps.impact.outputs.relevant == 'true'
        uses: actions/checkout@v7
        with:
          repository: gtvfx-envoy/envoy_utils
          ref: main
          path: downstream/envoy_utils

      - name: Test Envoy Utils against candidate
        if: steps.impact.outputs.relevant == 'true'
        id: compatibility
        continue-on-error: true
        shell: bash
        run: >-
          python scripts/release_automation.py compatibility
          --utils-root downstream/envoy_utils
          --output compatibility.json

      - name: Report advisory result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.impact.outputs.relevant }}" != true ]]; then
            echo "### Envoy Utils: no release impact" >> "$GITHUB_STEP_SUMMARY"
            echo "No relevant Envoy Core source or dependency changed." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "${{ steps.compatibility.outcome }}" == success ]]; then
            echo "### Envoy Utils: maintainer review" >> "$GITHUB_STEP_SUMMARY"
            echo "Envoy Utils passes against this candidate on ${{ matrix.os_name }}." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Review whether Envoy Utils should be repinned and released."
          else
            echo "### Envoy Utils: release required" >> "$GITHUB_STEP_SUMMARY"
            echo "Envoy Utils fails against this candidate on ${{ matrix.os_name }}." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Envoy Utils requires changes for this Envoy candidate."
          fi

      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: envoy-utils-compatibility-${{ matrix.os_name }}
          path: |
            impact.json
            compatibility.json
          if-no-files-found: ignore

  changes:
    name: Detect macOS-relevant changes
    runs-on: ["self-hosted", "Linux", "X64"]
    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - "rust/**"
              - "bin/**"
              - "scripts/**"
              - ".envoy/**"
              - ".github/workflows/**"
              - "pyproject.toml"

  macos:
    name: macOS tests (${{ matrix.architecture }})
    needs: changes
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            architecture: x86_64
          - runner: macos-15
            architecture: aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test native workspace
        working-directory: rust
        run: cargo test --workspace --exclude envoy-py

      - name: Test Rust Python bindings
        working-directory: rust
        run: cargo test -p envoy-py --lib

      - name: Build wheel
        run: |
          python3 -m pip install maturin pytest
          python3 -m maturin build --release --manifest-path rust/envoy-py/Cargo.toml

      - name: Test installed wheel
        run: |
          python3 -m pip install --force-reinstall --no-index --find-links rust/target/wheels envoy
          python3 -m pytest rust/envoy-py/tests -v
