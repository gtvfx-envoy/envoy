name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Unprefixed Envoy semantic version
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release pull request
    runs-on: ubuntu-24.04

    steps:
      - name: Create release automation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Prepare version files
        run: python scripts/release_automation.py prepare --version "${{ inputs.version }}"

      # As in lint.yml: ruff/pytest and fmt/clippy/test are each independent
      # checks. GitHub Actions runs a multi-line `run:` block via `bash -e`,
      # which aborts the whole script at the first failing line -- so
      # bundling them into one step has the same masking effect as chaining
      # separate steps with no guard. Split into individual steps with
      # `if: ${{ !cancelled() }}` so a release-prep run reports every
      # problem at once instead of one per re-dispatch.
      - name: Install Python automation dependencies
        run: python -m pip install ruff pytest

      - name: Run ruff check
        if: ${{ !cancelled() }}
        run: python -m ruff check scripts tests/test_release_automation.py

      - name: Run ruff format --check
        if: ${{ !cancelled() }}
        run: python -m ruff format --check scripts tests/test_release_automation.py

      - name: Run release automation tests
        if: ${{ !cancelled() }}
        run: python -m pytest tests/test_release_automation.py

      - name: Run cargo fmt --check
        working-directory: rust
        run: cargo fmt --check

      - name: Run cargo clippy
        if: ${{ !cancelled() }}
        working-directory: rust
        run: cargo clippy --workspace --exclude envoy-py --all-targets -- -D warnings

      - name: Run cargo test
        if: ${{ !cancelled() }}
        working-directory: rust
        run: cargo test --workspace --exclude envoy-py

      - name: Ensure release preparation label exists
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >-
          gh label create release-prep --color 5319E7 --force
          --description "Automated release preparation pull request"

      - name: Create or update draft pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/release-v${{ inputs.version }}
          base: main
          commit-message: Prepare v${{ inputs.version }} release
          title: Prepare v${{ inputs.version }} release
          body: |
            Automated Envoy release preparation.

            - Updates the Cargo workspace version and lockfile.
            - Runs the repository release-readiness checks.

            Merge only after the normal pull request checks pass.
          labels: release-prep
          draft: always-true
          delete-branch: false
