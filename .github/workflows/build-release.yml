name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version label for a validation build
        required: true
        default: dev

permissions:
  contents: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  windows-x86_64:
    name: Windows x64 release
    runs-on: [self-hosted, X64, Windows, windows-11, ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Ensure Git Bash is on PATH
        shell: pwsh
        run: |
          $git_bash_directory = 'C:\Program Files\Git\bin'
          $git_bash_path = Join-Path $git_bash_directory 'bash.exe'
          if (-not (Test-Path -LiteralPath $git_bash_path)) {
              throw 'Git Bash is required by the Rust toolchain action.'
          }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $git_bash_directory

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test native workspace
        working-directory: rust
        run: cargo test --workspace --exclude envoy-py

      - name: Test Rust Python bindings
        working-directory: rust
        run: cargo test -p envoy-py --lib

      - name: Build native CLIs
        run: python scripts/build_native.py --skip-wheel

      - name: Build and test Python wheel
        shell: pwsh
        run: |
          python -m pip install maturin pytest
          python -m maturin build --release --manifest-path rust/envoy-py/Cargo.toml --out dist
          python -m pip install --force-reinstall --no-index --find-links dist envoy
          python -m pytest rust/envoy-py/tests -v

      - name: Verify native CLIs
        shell: pwsh
        run: |
          .\rust\target\release\envoy.exe --version

      - name: Package Windows bundle
        run: >-
          python scripts/package_release.py
          --version $env:RELEASE_VERSION
          --target-name windows-x86_64
          --binary-dir rust/target/release
          --windows

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-x86_64
          path: |
            dist/envoy-*-windows-x86_64.zip
            dist/envoy-*.whl
          if-no-files-found: error

  linux-x86_64:
    name: Linux x64 release
    runs-on: [self-hosted, Linux, X64, debian-13, ci]

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Rust with musl target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install pinned cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build and test static native CLIs
        working-directory: rust
        run: |
          cross test --workspace --exclude envoy-py --target x86_64-unknown-linux-musl
          cross build --workspace --exclude envoy-py --release --target x86_64-unknown-linux-musl

      - name: Verify static native CLIs
        run: |
          rust/target/x86_64-unknown-linux-musl/release/envoy --version
          file rust/target/x86_64-unknown-linux-musl/release/envoy | grep -Eq 'statically linked|static-pie linked'

      - name: Build manylinux2014 wheel
        uses: PyO3/maturin-action@v1
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target-manylinux2014
        with:
          target: x86_64
          manylinux: "2014"
          args: >-
            --release --out dist
            --manifest-path rust/envoy-py/Cargo.toml

      - name: Restore manylinux build ownership
        if: always()
        run: |
          runner_user="$(id -u):$(id -g)"
          docker run --rm \
            --env RUNNER_USER="$runner_user" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            quay.io/pypa/manylinux2014_x86_64:latest \
            bash -c '
              for build_path in /workspace/dist /workspace/rust/target-manylinux2014; do
                if [[ -e "$build_path" ]]; then
                  chown -R "$RUNNER_USER" "$build_path"
                fi
              done
            '

      - name: Test Python wheel
        run: |
          python -m pip install pytest
          python -m pip install --force-reinstall --no-index --find-links dist envoy
          python -m pytest rust/envoy-py/tests -v

      - name: Package Linux bundle
        run: >-
          python scripts/package_release.py
          --version "$RELEASE_VERSION"
          --target-name linux-x86_64-musl
          --binary-dir rust/target/x86_64-unknown-linux-musl/release

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-x86_64
          path: |
            dist/envoy-*-linux-x86_64-musl.tar.gz
            dist/envoy-*.whl
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.target_name }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target_name: macos-x86_64
          - runner: macos-15
            target_name: macos-aarch64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Test native workspace
        working-directory: rust
        run: cargo test --workspace --exclude envoy-py

      - name: Test Rust Python bindings
        working-directory: rust
        run: cargo test -p envoy-py --lib

      - name: Build native CLIs
        run: python3 scripts/build_native.py --skip-wheel

      - name: Build and test Python wheel
        run: |
          python3 -m pip install maturin pytest
          python3 -m maturin build --release --manifest-path rust/envoy-py/Cargo.toml --out dist
          python3 -m pip install --force-reinstall --no-index --find-links dist envoy
          python3 -m pytest rust/envoy-py/tests -v

      - name: Verify native CLIs
        run: |
          rust/target/release/envoy --version

      # Signing and notarization will be inserted here when repository
      # credentials and an ENABLE_ARTIFACT_SIGNING variable are available.
      - name: Package macOS bundle
        run: >-
          python3 scripts/package_release.py
          --version "$RELEASE_VERSION"
          --target-name ${{ matrix.target_name }}
          --binary-dir rust/target/release

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target_name }}
          path: |
            dist/envoy-*-macos-*.tar.gz
            dist/envoy-*.whl
          if-no-files-found: error

  publish:
    name: Publish checksummed release
    if: github.event_name == 'push'
    needs: [windows-x86_64, linux-x86_64, macos]
    runs-on: ubuntu-24.04

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create SHA-256 manifest
        working-directory: dist
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.whl
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body: |
            Envoy supports Windows, Linux, and macOS. These artifacts are
            checksummed but currently unsigned. See the installation guide
            for Windows SmartScreen and macOS Gatekeeper guidance.

  notify-downstream:
    name: Notify downstream repositories
    if: vars.RELEASE_AUTOMATION_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create cross-repository token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_AUTOMATION_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: envoy_utils,despatch

      - name: Dispatch Envoy release event
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ENVOY_TAG: ${{ github.ref_name }}
        run: |
          envoy_version="${ENVOY_TAG#v}"
          envoy_commit="$(git rev-list -n 1 "$ENVOY_TAG")"
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$ENVOY_TAG"
          for downstream in envoy_utils despatch; do
            gh api --method POST \
              "repos/$GITHUB_REPOSITORY_OWNER/$downstream/dispatches" \
              -f event_type=envoy-released \
              -F 'client_payload[schema_version]=1' \
              -f "client_payload[envoy_tag]=$ENVOY_TAG" \
              -f "client_payload[envoy_version]=$envoy_version" \
              -f "client_payload[envoy_commit]=$envoy_commit" \
              -f "client_payload[release_url]=$release_url"
          done
