site_name: Envoy
site_url: https://gtvfx-envoy.github.io/envoy/
site_description: Platform-agnostic environment orchestration for applications.
repo_name: gtvfx-envoy/envoy
repo_url: https://github.com/gtvfx-envoy/envoy
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/images/envoy_icon_charcoal_1024.png
  favicon: assets/images/envoy.ico
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            members_order: source

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Installation: installation.md
  - Core Concepts: concepts.md
  - Environment Files: env-files.md
  - Bundle Discovery: bundle-discovery.md
  - Bundle Caching: caching.md
  - Launcher: launcher.md
  - Team Administration: team-administration.md
  - Environment Modes: environment-modes.md
  - User Configuration: user-config.md
  - Telemetry: telemetry.md
  - CLI Reference:
    - envoy: cli-reference/envoy.md
  - Reference: reference/
  - Examples: examples.md
  - Advanced Topics: advanced.md
  - Maintainers:
    - Overview: maintainers/index.md
    - Build and Release Chain: maintainers/build-chain.md
    - Releasing: maintainers/releasing.md
    - CI Runners: maintainers/ci-runners.md
    - Release Troubleshooting: maintainers/release-troubleshooting.md
  - Troubleshooting: troubleshooting.md
